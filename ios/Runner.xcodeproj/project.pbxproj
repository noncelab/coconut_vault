			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n\n\n# Configuration에 따른 앱 이름 설정\nif [[ \"${CONFIGURATION}\" == *\"mainnet\"* ]]; then\n    EN_APP_NAME=\"Coconut Vault\"\n    KO_APP_NAME=\"코코넛 볼트\"\n    JA_APP_NAME=\"Coconut Vault\"\nelif [[ \"${CONFIGURATION}\" == *\"regtest\"* ]]; then\n    EN_APP_NAME=\"Coconut Vault-Regtest\"\n    KO_APP_NAME=\"코코넛 볼트 학습용\"\n    JA_APP_NAME=\"Coconut Vault-Regtest\"\nelse\n    EN_APP_NAME=\"Coconut Vault\"\n    KO_APP_NAME=\"코코넛 볼트\"\n    JA_APP_NAME=\"Coconut Vault\"\nfi\n\n# 권한 문구 설정\nEN_NSBluetoothAlwaysUsageDescription=\"This app detects if Bluetooth is enabled for security enhancement and restricts app functionality when Bluetooth is enabled to prevent unauthorized device connections that could lead to leakage of important information.\"\nKO_NSBluetoothAlwaysUsageDescription=\"이 앱은 보안 강화를 위해 Bluetooth가 활성화되어 있는지 감지하고, Bluetooth가 활성화 된 경우 무단 장치와의 연결로 중요 정보가 유출되는 것을 방지하기 위해 앱 기능에 접근을 제한합니다.\"\nJA_NSBluetoothAlwaysUsageDescription=\"このアプリはセキュリティ強化のため、Bluetoothが有効になっているかを検出し、重要な情報が漏洩する恐れのある不正なデバイス接続を防ぐために、Bluetoothが有効な場合はアプリの機能を制限します。\"\nEN_NSBluetoothPeripheralUsageDescription=\"This app detects if Bluetooth is enabled for security enhancement and restricts app functionality when Bluetooth is enabled to prevent unauthorized device connections that could lead to leakage of important information.\"\nKO_NSBluetoothPeripheralUsageDescription=\"이 앱은 보안 강화를 위해 Bluetooth가 활성화되어 있는지 감지하고, Bluetooth가 활성화 된 경우 무단 장치와의 연결로 중요 정보가 유출되는 것을 방지하기 위해 앱 기능에 접근을 제한합니다.\"\nJA_NSBluetoothPeripheralUsageDescription=\"このアプリはセキュリティ強化のため、Bluetoothが有効になっているかを検出し、重要な情報が漏洩する恐れのある不正なデバイス接続を防ぐために、Bluetoothが有効な場合はアプリの機能を制限します。\"\n\nEN_NSCameraUsageDescription=\"Camera access is required for QR code scanning.\"\nKO_NSCameraUsageDescription=\"QR 코드 스캔을 위해 카메라가 필요합니다.\"\nJA_NSCameraUsageDescription=\"QRコードをスキャンするためにカメラへのアクセスが必要です。\"\n\nEN_NSFaceIDUsageDescription=\"Face ID is required to unlock and access secure features.\"\nKO_NSFaceIDUsageDescription=\"잠금 해제 및 보안 기능 접근을 위해 Face ID를 사용합니다.\"\nJA_NSFaceIDUsageDescription=\"Face IDは安全な機能をロック解除およびアクセスするために必要です。\"\n\n\necho \"EN_APP_NAME: $EN_APP_NAME\"\necho \"KO_APP_NAME: $KO_APP_NAME\"\necho \"JA_APP_NAME: $JA_APP_NAME\"\n\necho \"!!!!\"\necho \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/en.lproj\"\necho \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/en.lproj\"\n# 영어 InfoPlist.strings 파일 경로\nEN_STRINGS_PATH=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/en.lproj\"\nEN_STRINGS_FILE=\"${EN_STRINGS_PATH}/InfoPlist.strings\"\n\n# 한국어 InfoPlist.strings 파일 경로\nKO_STRINGS_PATH=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/ko.lproj\"\nKO_STRINGS_FILE=\"${KO_STRINGS_PATH}/InfoPlist.strings\"\n\n# 일본어 InfoPlist.strings 파일 경로\nJA_STRINGS_PATH=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/ja.lproj\"\nJA_STRINGS_FILE=\"${JA_STRINGS_PATH}/InfoPlist.strings\"\n\n# 디렉토리 생성\nmkdir -p \"$EN_STRINGS_PATH\"\nmkdir -p \"$KO_STRINGS_PATH\"\nmkdir -p \"$JA_STRINGS_PATH\"\n\n# InfoPlist.strings 생성\ncat > \"$EN_STRINGS_FILE\" <<EOF\nCFBundleDisplayName=\"$EN_APP_NAME\";\nNSCameraUsageDescription=\"$EN_NSCameraUsageDescription\";\nNSFaceIDUsageDescription=\"$EN_NSFaceIDUsageDescription\";\nNSBluetoothAlwaysUsageDescription=\"$EN_NSBluetoothAlwaysUsageDescription\";\nNSBluetoothPeripheralUsageDescription=\"$EN_NSBluetoothPeripheralUsageDescription\";\nEOF\n\ncat > \"$KO_STRINGS_FILE\" <<EOF\nCFBundleDisplayName=\"$KO_APP_NAME\";\nNSCameraUsageDescription=\"$KO_NSCameraUsageDescription\";\nNSFaceIDUsageDescription=\"$KO_NSFaceIDUsageDescription\";\nNSBluetoothAlwaysUsageDescription=\"$KO_NSBluetoothAlwaysUsageDescription\";\nNSBluetoothPeripheralUsageDescription=\"$KO_NSBluetoothPeripheralUsageDescription\";\nEOF\n\ncat > \"$JA_STRINGS_FILE\" <<EOF\nCFBundleDisplayName=\"$JA_APP_NAME\";\nNSCameraUsageDescription=\"$JA_NSCameraUsageDescription\";\nNSFaceIDUsageDescription=\"$JA_NSFaceIDUsageDescription\";\nNSBluetoothAlwaysUsageDescription=\"$JA_NSBluetoothAlwaysUsageDescription\";\nNSBluetoothPeripheralUsageDescription=\"$JA_NSBluetoothPeripheralUsageDescription\";\nEOF\n\n\necho \"✅ 앱 이름 및 권한 설명 설정 완료\"\necho \"📝 Configuration: $CONFIGURATION\"\necho \"📝 English App Name: $EN_APP_NAME\"\necho \"📝 Korean App Name: $KO_APP_NAME\"\necho \"📝 Japanese App Name: $JA_APP_NAME\"\n";
		};
